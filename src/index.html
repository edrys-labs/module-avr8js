<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVR8js Simulator</title>

    <meta name="description"
        content="This is an Arduino simulator module for Edrys based on <a href='https://github.com/wokwi/avr8js' target='_blank'>AVR8js</a>. It must be connected with an additional editor module, such as <a href='https://github.com/edrys-labs/module-monaco-editor' target='_blank'>module-monaco-editor</a> or <a href='https://github.com/edrys-labs/module-blockly-duino-v2' target='_blank'>module-blockly-duino-v2</a>. Uploads must be sent with the subject `execute`. For more information and configuration options, see <br><br><a href='https://github.com/edrys-labs/module-avr8js' target='_blank'>edrys-labs/module-avr8js</a>" />
    <meta name="show-in" content="*" />
    <meta 
      name="module-config" 
      content="{
        'config': {
          'execute': {
            'type': 'text',
            'hint': 'Message subject the simulator runs code from (default: execute)',
          },
          'modules': {
            'type': 'code-area',
            'hint': 'The circuit as Wokwi parts in HTML, e.g. <wokwi-led pin=13></wokwi-led>',
          },
          'synchronize': {
            'type': 'boolean',
            'hint': 'Run code sent by any peer in the room on every peer (default: false, each peer runs only its own code)',
          },
        },
      }" 
    />

    <script src="https://edrys-labs.github.io/module/edrys.js"></script>
    <script defer src="https://edrys-labs.github.io/module/vendor/alpine.min.js"></script>
    <link rel="stylesheet" href="https://edrys-labs.github.io/module/vendor/water.min.css" />
    <link rel="stylesheet" href="https://edrys-labs.github.io/module/vendor/open-iconic/css/open-iconic.min.css" />

    <script defer type="module">
        import { AVR8js } from "./index.ts"
        window["AVR8js"] = AVR8js
    </script>

    <script>
        function disabled(bool) {
            document.getElementById("send").disabled = bool
            document.getElementById("stop").disabled = bool
            document.getElementById("stdin").disabled = bool
        }

        function send() {
            console.log("send")
            const input = document.getElementById("stdin")

            if (window.runner) {
                const value = input?.value || ""

                toTerminal(value + "\n")
                // end the line like the Arduino Serial Monitor does
                window.runner.serial(value + "\n")
            }

            input.value = ""
        }

        // edrys-Lite passes "" for a module without config
        function config() {
            const config = Edrys.module?.config
            return typeof config === "object" && config || {}
        }

        // the message subject the simulator runs code from
        function executeSubject() {
            return config().execute || "execute"
        }

        let state = "loading"

        // kind is the badge colour: on, off or wait
        function setStatus(name, kind) {
            state = name
            const badge = document.getElementById("status")
            badge.textContent = name
            badge.className = "badge " + kind
        }

        function stop() {
            console.log("stop")
            // a stop during compiling drops the compile, so it ends that too
            const active = window.runner || state === "compiling"

            if (window.runner) {
                window.runner.stop()
                window.runner = null
                toTerminal("\nexecution stopped")

                disabled(true)
            }

            if (active) {
                setStatus("stopped", "wait")
            }
        }

        // Message that stops the simulation on every peer of the room (with synchronize)
        const STOP_SUBJECT = "avr8js-stop"

        // The stop button: with synchronize, Stop is shared like Run, and the
        // stored sketch is removed so nobody restarts it on reload or join.
        function stopClicked() {
            if (config().synchronize === true) {
                Edrys.clearState(sketchKey())
                // the body names the subject, in case several simulators share a room
                Edrys.sendMessage(STOP_SUBJECT, executeSubject())
            }

            uploads++ // drops a compile that is still running
            stop()
        }

        // Counts uploads, so a compile that a newer upload overtook is dropped
        // instead of starting a second simulation next to the newer one.
        let uploads = 0

        async function compile(sketch) {
            const upload = ++uploads

            if (window.runner) {
                stop()
            }

            toTerminal("\nstart compiling ...")
            setStatus("compiling", "wait")

            let hex
            try {
                hex = await window["AVR8js"].build(sketch)
            } catch (e) {
                if (upload === uploads) {
                    toTerminal(`\ncompile server (hexi.wokwi.com) failed: ${e.message}`, false)
                    setStatus("error", "off")
                }
                return
            }

            if (upload !== uploads) {
                return
            }

            if (hex.stderr) {
                toTerminal(hex.stderr, false, true)
                setStatus("error", "off")
                return
            }

            toTerminal(hex.stdout, true, true)

            if (hex.hex) {
                disabled(false)
                window.runner = window["AVR8js"].execute(hex.hex, toTerminal)
                setStatus("running", "on")
            } else {
                window.runner = null
                setStatus("error", "off")
            }
        }

        // Output comes from other peers' sketches and the compiler, so it is
        // only ever added as text, never parsed as HTML.
        // Serial output arrives byte by byte, so it is collected and written
        // once per frame. Only the newest TERMINAL_LIMIT characters are kept,
        // so a sketch that prints forever doesn't grow the page without limit.
        const TERMINAL_LIMIT = 100000
        let terminalLength = 0
        let pending = ""
        let flushScheduled = false

        function toTerminal(output, ok = true, clear = false) {
            const terminal = document.getElementById("stdout")
            terminal.querySelector(".hint")?.remove()

            if (clear) {
                pending = ""
                terminal.textContent = ""
                terminalLength = 0
            }

            if (ok) {
                pending += output
                // a hidden tab gets no frames, so keep the buffer bounded too
                if (pending.length > 2 * TERMINAL_LIMIT) {
                    pending = pending.slice(-TERMINAL_LIMIT)
                }
                if (!flushScheduled) {
                    flushScheduled = true
                    requestAnimationFrame(flushTerminal)
                }
                return
            }

            // keep the order: earlier output first, then the error
            flushTerminal()
            const span = document.createElement("span")
            span.className = "error"
            span.textContent = output
            terminal.append(span)
            terminalLength += output.length
            trimTerminal(terminal)
            terminal.scrollTo(0, terminal.scrollHeight)
        }

        function flushTerminal() {
            flushScheduled = false
            if (!pending) {
                return
            }

            const terminal = document.getElementById("stdout")
            terminal.append(pending)
            terminalLength += pending.length
            pending = ""
            trimTerminal(terminal)
            terminal.scrollTo(0, terminal.scrollHeight)
        }

        // drop the oldest output beyond TERMINAL_LIMIT characters
        function trimTerminal(terminal) {
            let excess = terminalLength - TERMINAL_LIMIT

            while (excess > 0 && terminal.firstChild) {
                const node = terminal.firstChild
                const length = node.textContent.length

                if (length <= excess) {
                    node.remove()
                    terminalLength -= length
                    excess -= length
                } else {
                    if (node.nodeType === Node.TEXT_NODE) {
                        node.deleteData(0, excess)
                    } else {
                        node.textContent = node.textContent.slice(excess)
                    }
                    terminalLength -= excess
                    excess = 0
                }
            }
        }

        Edrys.onReady(() => {
            console.log("AVR8js simulator loaded ...")

            const content = config().modules || ""

            if (content.trim()) {
                document.getElementById("modules").innerHTML = content
            } else {
                document.getElementById("modules").innerHTML =
                    '<p class="hint empty">No circuit configured: add Wokwi parts in the module settings (<code>modules</code>).</p>'
            }

            document.getElementById("stdout").querySelector(".hint")?.replaceChildren(
                "Waiting for code from an editor module (subject ",
                Object.assign(document.createElement("code"), {
                    textContent: executeSubject()
                }),
                ")…"
            )
            setStatus("idle", "wait")

            const inputElement = document.getElementById('stdin');

            inputElement.addEventListener('keydown', function (event) {
                if (event.key === "Enter") {
                    // Call your function here
                    send()
                }
            });

            // with synchronize, pick up the program the room is running (it starts at time 0)
            if (config().synchronize === true) {
                const sketch = Edrys.getState(sketchKey(), "Value")

                if (sketch) {
                    whenLoaded(() => compile(sketch))
                }
            }
        });

        // Room state is shared by all modules in the room, so the key names
        // the module and the subject it listens to.
        function sketchKey() {
            return "avr8js:" + executeSubject()
        }

        // window.AVR8js comes from the bundled module script
        function whenLoaded(fn) {
            if (window["AVR8js"]) {
                fn()
            } else {
                window.addEventListener("load", fn, { once: true })
            }
        }

        Edrys.onMessage(
            ({
                from,
                subject,
                body,
                module
            }) => {
                if (subject === executeSubject()) {
                    // without synchronize, only run code this peer sent itself
                    if (config().synchronize !== true && from !== Edrys.username) {
                        return
                    }

                    try {
                        let data = JSON.parse(body)
                    } catch (e) {
                        // the sender keeps the upload in the room for peers who join or reload later
                        if (config().synchronize === true && from === Edrys.username) {
                            Edrys.getState(sketchKey(), "Value", body)
                        }

                        compile(body)
                    }


                } else if (
                    subject === STOP_SUBJECT &&
                    module === Edrys.module.url &&
                    body === executeSubject() &&
                    config().synchronize === true &&
                    from !== Edrys.username // the sender stopped already
                ) {
                    uploads++
                    stop()
                }
            }, promiscuous = true);
    </script>

    <style>
        /* water.css follows the OS colour scheme, so the terminal does too */
        :root {
            /* white, not grey: water.css greys the inputs and buttons already */
            --terminal-background: #fff;
            --terminal-border: rgba(0, 0, 0, 0.2);
            --terminal-text: #2b2b2b;
            --terminal-error: #b8384a;
            --terminal-scrollbar: #c8c8c8;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --terminal-background: #1a1b26;
                --terminal-border: #1a1b26;
                --terminal-text: #c0caf5;
                --terminal-error: #f7768e;
                --terminal-scrollbar: #414868;
            }
        }

        /* the terminal takes the height the circuit leaves, so a short
           iframe scrolls the output, not the page */
        body {
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            height: 100vh;
            max-width: none;
            margin: 0;
            /* edrys-Lite puts the module name over the top-right corner */
            padding: 1rem 0.5rem 0.5rem;
        }

        #header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem 1rem;
            margin-bottom: 0.5rem;
        }

        .title {
            font-size: 1.4em;
            line-height: 1;
        }

        .status {
            font-size: small;
        }
        .status > .label {
            opacity: 0.7;
        }

        .status .badge {
            display: inline-block;
            padding: 0.1rem 0.5rem;
            border-radius: 999px;
            font-weight: bold;
            color: #fff;
        }
        /* dark enough for white text to clear WCAG AA */
        .status .badge.on {
            background-color: #1f7a45;
        }
        .status .badge.off {
            background-color: #b8384a;
        }
        .status .badge.wait {
            background-color: #6b6b6b;
        }

        .controls {
            margin-left: auto;
            font-size: small;
        }
        .controls button {
            margin: 0;
            white-space: nowrap;
        }
        /* red while a program runs, so Stop doesn't read as disabled grey */
        #stop:enabled {
            background: #b8384a;
            color: #fff;
        }
        #stop:enabled:hover {
            background: #9e2f3f;
        }

        .hint {
            opacity: 0.7;
        }

        #modules .empty {
            margin: 0 0 0.5rem;
            padding: 0.75rem;
            border: 1px dashed currentColor;
            border-radius: 6px;
        }

        #sensors:empty {
            display: none;
        }
        #sensors {
            margin-bottom: 0.5rem;
        }

        .slider {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.25rem 0.75rem;
            margin: 0;
        }
        .slider input {
            flex: 1 1 8rem;
            min-width: 0;
            margin: 0;
        }
        .slider output {
            min-width: 7ch;
            font-family: monospace;
            text-align: right;
        }

        #stdout {
            flex: 1 1 auto;
            min-height: 6rem;
            overflow: auto;
            padding: 0.5rem;
            border: 1px solid var(--terminal-border);
            border-radius: 6px;
            background: var(--terminal-background);
            color: var(--terminal-text);
            font-family: monospace;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            scrollbar-width: thin;
            scrollbar-color: var(--terminal-scrollbar) var(--terminal-background);
        }

        /* water.css styles code for the page background, not the terminal */
        #stdout code {
            padding: 0;
            background: none;
            color: inherit;
            font-weight: bold;
        }

        #stdout .error {
            color: var(--terminal-error);
        }

        #input {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        #input input {
            flex: 1;
            min-width: 0;
            margin: 0;
        }
        #input button {
            margin: 0;
            white-space: nowrap;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }
    </style>

</head>

<body>
    <div id="header">
        <span class="title">AVR8js</span>
        <span class="status">
            <span class="label">status:</span>
            <span id="status" class="badge wait">loading</span>
        </span>
        <span class="controls">
            <button id="stop" onclick="stopClicked()" disabled>
                <span class="oi" data-glyph="media-stop" aria-hidden="true"></span> Stop
            </button>
        </span>
    </div>

    <div id="modules"></div>
    <div id="sensors"></div>

    <div id="stdout"><span class="hint">Loading…</span></div>

    <div id="input">
        <label class="visually-hidden" for="stdin">Serial input</label>
        <input id="stdin" type="text" placeholder="Serial input" disabled>
        <button id="send" onclick="send()" disabled>
            <span class="oi" data-glyph="chevron-right" aria-hidden="true"></span> Send
        </button>
    </div>
</body>

</html>
