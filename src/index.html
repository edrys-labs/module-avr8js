<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVR8js Simulator</title>

    <meta name="description"
        content="This is an Arduino simulator module for Edrys based on <a href='https://github.com/wokwi/avr8js' target='_blank'>AVR8js</a>. It must be connected with an additional editor module, such as <a href='https://github.com/edrys-labs/module-monaco-editor' target='_blank'>module-monaco-editor</a> or <a href='https://github.com/edrys-labs/module-blockly-duino-v2' target='_blank'>module-blockly-duino-v2</a>. Uploads must be sent with the subject `execute`. For more information and configuration options, see <br><br><a href='https://github.com/edrys-labs/module-avr8js' target='_blank'>edrys-labs/module-avr8js</a>" />
    <meta name="show-in" content="*" />
    <meta 
      name="module-config" 
      content="{
        'config': {
          'execute': {
            'type': 'text',
            'hint': 'Message subject the simulator runs code from (default: execute)',
          },
          'modules': {
            'type': 'code-area',
            'hint': 'The circuit as Wokwi parts in HTML, e.g. <wokwi-led pin=13></wokwi-led>',
          },
          'synchronize': {
            'type': 'boolean',
            'hint': 'Run code sent by any peer in the room on every peer (default: false, each peer runs only its own code)',
          },
        },
      }" 
    />

    <script src="https://edrys-labs.github.io/module/edrys.js"></script>
    <script defer src="https://edrys-labs.github.io/module/vendor/alpine.min.js"></script>
    <link rel="stylesheet" href="https://edrys-labs.github.io/module/vendor/water.min.css" />
    <link rel="stylesheet" href="https://edrys-labs.github.io/module/vendor/open-iconic/css/open-iconic.min.css" />

    <!-- inline tags, so parcel bundles everything into one docs/index.html -->
    <style>
        @import "./styles.css";
    </style>

    <script type="module">
        import "./app.js"
    </script>
</head>

<body>
    <div id="header">
        <span class="title">AVR8js</span>
        <span class="status">
            <span class="label">status:</span>
            <span id="status" class="badge wait">loading</span>
        </span>
        <span class="controls">
            <button id="stop" disabled>
                <span class="oi" data-glyph="media-stop" aria-hidden="true"></span> Stop
            </button>
        </span>
    </div>

    <div id="modules"></div>
    <div id="sensors"></div>

    <div id="stdout"><span class="hint">Loading…</span></div>

    <div id="input">
        <label class="visually-hidden" for="stdin">Serial input</label>
        <input id="stdin" type="text" placeholder="Serial input" disabled>
        <button id="send" disabled>
            <span class="oi" data-glyph="chevron-right" aria-hidden="true"></span> Send
        </button>
    </div>
</body>

</html>
