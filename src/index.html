<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVR8js Simulator</title>

    <meta name="description"
        content="This is an Arduino simulator module for Edrys based on <a href='https://github.com/wokwi/avr8js' target='_blank'>AVR8js</a>. It must be connected with an additional editor module, such as <a href='https://github.com/edrys-labs/module-editor' target='_blank'>module-editor</a> or <a href='https://github.com/edrys-labs/module-blockly-duino-v2' target='_blank'>module-blockly-duino-v2</a>. Uploads must be send via topic `execute`, of for more information and configuration options, see <br><br><a href='https://github.com/edrys-labs/module-avr8js' target='_blank'>edrys-labs/module-avr8js</a>" />
    <meta name="show-in" content="*" />
    <meta 
      name="module-config" 
      content="{
        'config': {
          'execute': {
            'type': string,
            'hint': 'Message that the module will listen to (default: execute)',
          },
          'modules': {
            'type': text-area,
            'hint': 'HTML code to be injected in the module',
          },
          'synchronize': {
            'type': 'boolean',
            'hint': 'Run code sent by any peer in the room on every peer (default: false, each peer runs only its own code)',
          },
        },
      }" 
    />

    <script src="https://edrys-labs.github.io/module/edrys.js"></script>
    <script defer src="https://edrys-labs.github.io/module/vendor/alpine.min.js"></script>
    <link rel="stylesheet" href="https://edrys-labs.github.io/module/vendor/water.min.css" />
    <link rel="stylesheet" href="https://edrys-labs.github.io/module/vendor/open-iconic/css/open-iconic.min.css" />

    <script defer type="module">
        import { AVR8js } from "./index.ts"
        window["AVR8js"] = AVR8js
    </script>

    <script>
        function disabled(bool) {
            document.getElementById("send").disabled = bool
            document.getElementById("stop").disabled = bool
            document.getElementById("stdin").disabled = bool
        }

        function send() {
            console.log("send")
            const input = document.getElementById("stdin")

            if (window.runner) {
                const value = input?.value || ""

                toTerminal(value + "\n")
                // end the line like the Arduino Serial Monitor does
                window.runner.serial(value + "\n")
            }

            input.value = ""
        }

        function stop() {
            console.log("stop")
            if (window.runner) {
                window.runner.stop()
                window.runner = null
                toTerminal("\nexecution stopped")

                disabled(true)
            }
        }

        // Message that stops the simulation on every peer of the room (with synchronize)
        const STOP_SUBJECT = "avr8js-stop"

        // The stop button: with synchronize, Stop is shared like Run, and the
        // stored sketch is removed so nobody restarts it on reload or join.
        function stopClicked() {
            if (Edrys.module.config?.synchronize === true) {
                Edrys.clearState(sketchKey())
                // the body names the subject, in case several simulators share a room
                Edrys.sendMessage(STOP_SUBJECT, Edrys.module.config?.execute || "execute")
            }

            uploads++ // drops a compile that is still running
            stop()
        }

        // Counts uploads, so a compile that a newer upload overtook is dropped
        // instead of starting a second simulation next to the newer one.
        let uploads = 0

        async function compile(sketch) {
            const upload = ++uploads

            if (window.runner) {
                stop()
            }

            toTerminal("\nstart compiling ...")

            let hex
            try {
                hex = await window["AVR8js"].build(sketch)
            } catch (e) {
                if (upload === uploads) {
                    toTerminal(`\ncompile server (hexi.wokwi.com) failed: ${e.message}`, false)
                }
                return
            }

            if (upload !== uploads) {
                return
            }

            if (hex.stderr) {
                toTerminal(hex.stderr, false, true)
                return
            }

            toTerminal(hex.stdout, true, true)

            if (hex.hex) {
                disabled(false)
                window.runner = window["AVR8js"].execute(hex.hex, toTerminal)
            } else {
                window.runner = null
            }
        }

        // Output comes from other peers' sketches and the compiler, so it is
        // only ever added as text, never parsed as HTML.
        // Serial output arrives byte by byte, so it is collected and written
        // once per frame. Only the newest TERMINAL_LIMIT characters are kept,
        // so a sketch that prints forever doesn't grow the page without limit.
        const TERMINAL_LIMIT = 100000
        let terminalLength = 0
        let pending = ""
        let flushScheduled = false

        function toTerminal(output, ok = true, clear = false) {
            const terminal = document.getElementById("stdout")

            if (clear) {
                pending = ""
                terminal.textContent = ""
                terminalLength = 0
            }

            if (ok) {
                pending += output
                // a hidden tab gets no frames, so keep the buffer bounded too
                if (pending.length > 2 * TERMINAL_LIMIT) {
                    pending = pending.slice(-TERMINAL_LIMIT)
                }
                if (!flushScheduled) {
                    flushScheduled = true
                    requestAnimationFrame(flushTerminal)
                }
                return
            }

            // keep the order: earlier output first, then the error
            flushTerminal()
            const span = document.createElement("span")
            span.className = "error"
            span.textContent = output
            terminal.append(span)
            terminalLength += output.length
            trimTerminal(terminal)
            terminal.scrollTo(0, terminal.scrollHeight)
        }

        function flushTerminal() {
            flushScheduled = false
            if (!pending) {
                return
            }

            const terminal = document.getElementById("stdout")
            terminal.append(pending)
            terminalLength += pending.length
            pending = ""
            trimTerminal(terminal)
            terminal.scrollTo(0, terminal.scrollHeight)
        }

        // drop the oldest output beyond TERMINAL_LIMIT characters
        function trimTerminal(terminal) {
            let excess = terminalLength - TERMINAL_LIMIT

            while (excess > 0 && terminal.firstChild) {
                const node = terminal.firstChild
                const length = node.textContent.length

                if (length <= excess) {
                    node.remove()
                    terminalLength -= length
                    excess -= length
                } else {
                    if (node.nodeType === Node.TEXT_NODE) {
                        node.deleteData(0, excess)
                    } else {
                        node.textContent = node.textContent.slice(excess)
                    }
                    terminalLength -= excess
                    excess = 0
                }
            }
        }

        Edrys.onReady(() => {
            console.log("AVR8js simulator loaded ...")

            let content = Edrys.module.config.modules || ""

            content += "\n\n" + (Edrys.module[Edrys.role.toLowerCase() + 'Config']?.modules || "")

            document.getElementById("modules").innerHTML = content

            const inputElement = document.getElementById('stdin');

            inputElement.addEventListener('keydown', function (event) {
                if (event.key === "Enter") {
                    // Call your function here
                    send()
                }
            });

            // with synchronize, pick up the program the room is running (it starts at time 0)
            if (Edrys.module.config?.synchronize === true) {
                const sketch = Edrys.getState(sketchKey(), "Value")

                if (sketch) {
                    whenLoaded(() => compile(sketch))
                }
            }
        });

        // Room state is shared by all modules in the room, so the key names
        // the module and the subject it listens to.
        function sketchKey() {
            return "avr8js:" + (Edrys.module.config?.execute || "execute")
        }

        // window.AVR8js comes from the bundled module script
        function whenLoaded(fn) {
            if (window["AVR8js"]) {
                fn()
            } else {
                window.addEventListener("load", fn, { once: true })
            }
        }

        Edrys.onMessage(
            ({
                from,
                subject,
                body,
                module
            }) => {
                if (subject === (Edrys.module.config?.execute || "execute")) {
                    // without synchronize, only run code this peer sent itself
                    if (Edrys.module.config?.synchronize !== true && from !== Edrys.username) {
                        return
                    }

                    try {
                        let data = JSON.parse(body)
                    } catch (e) {
                        // the sender keeps the upload in the room for peers who join or reload later
                        if (Edrys.module.config?.synchronize === true && from === Edrys.username) {
                            Edrys.getState(sketchKey(), "Value", body)
                        }

                        compile(body)
                    }


                } else if (
                    subject === STOP_SUBJECT &&
                    module === Edrys.module.url &&
                    body === (Edrys.module.config?.execute || "execute") &&
                    Edrys.module.config?.synchronize === true &&
                    from !== Edrys.username // the sender stopped already
                ) {
                    uploads++
                    stop()
                }
            }, promiscuous = true);
    </script>

    <style>
        #modules {
            width: 100%;
            height: 100px;
        }

        #stdout {
            width: calc(100% - 1rem);
            height: 15rem;
            border: solid 1px white;
            padding: 0.5rem;
            white-space: pre-wrap;
            overflow: auto;
            background-color: #000;
            color: #fff;
        }

        #stdout .error {
            color: red;
        }

        #stdin {
            display: inline;
            width: calc(100% - 12.5rem);
            margin-top: 0.5rem;
        }

        #send {
            display: inline;
            width: 4.75rem;
            margin-top: 0.5rem;
            margin-right: 0;
        }

        #stop {
            display: inline;
            width: 5.75rem;
            float: right;
            margin-top: 0.5rem;
            margin-right: 0;
        }
    </style>

</head>

<body>
    <div id="terminal">
        <div id="stdout">$ ...</div>

        <button id="send" onclick="send()" disabled>
            >>
        </button>
        <input id="stdin" type="text" disabled></input>

        <button id="stop" onclick="stopClicked()" disabled>
            stop
        </button>
    </div>
    <div id="modules">
    </div>
</body>

</html>
